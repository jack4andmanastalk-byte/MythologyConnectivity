name: verify
on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # 明示しないと既定が読めない（ruleset の突合に必要）
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy pandas

      # 1) 事前登録が結果より先にコミットされているか
      - name: pre-registration order
        run: python src/check_prereg.py

      # 1b) 登録簿の Holm しきい値と n_perm 要件
      - name: check registry thresholds
        run: make registry

      # 2) スキーマ・証拠・重複
      - name: validate annotations
        run: make validate

      # 3) コード内の解析定数ゼロ
      - name: hard-code audit
        run: make audit

      # 3b) Holm・登録簿・scheduler・検証状態のパース/競合境界条件
      - name: registry, scheduler, and network-status regression tests
        run: make test

      # 3c) 追跡下の生成物が「今のコードから再生成した値」と一致するか
      #     （derived/ を手で編集していないことの証拠。--full は生成関数を再実行）
      - name: generated artifacts are current
        run: python src/check_generated.py --full

      # 3d) 事前登録セルと凍結データが書き換わっていないか（枝 #14）
      #     checkout は fetch-depth: 0 なので origin/main が解決できる
      - name: pre-registered cells and frozen data are unchanged
        run: python src/append_only.py --base origin/main

      # 3e) ruleset（コードで直せない設定）が期待どおりか。設定が緩んだら赤くなる
      - name: repository ruleset matches the expected policy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python src/repo_rules.py --live

      # 4) 運用シミュレーション（ADR 0002）と全解析。資材不足は成功と偽装せず明示状態にする。
      - name: run pipeline
        run: make run

      - name: summarize network verification status
        if: always()
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          status_path = Path('outputs/network_verification_status.json')
          if not status_path.is_file():
              summary = '## v17 network verification: FAILED\n\n- Status file is missing; no verification result was recorded.\n'
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
                  stream.write(summary)
              print(summary)
              sys.exit(1)
          status = json.loads(status_path.read_text(encoding='utf-8'))
          state = status.get('status', 'unknown')
          reason = status.get('reason', '')
          expected = status.get('expected', {})
          checks = status.get('checks') or {}
          label = {'passed': 'VERIFIED', 'unavailable': 'UNVERIFIED', 'failed': 'FAILED'}.get(state, state.upper())
          summary = [f'## v17 network verification: {label}', '', f'- Status: `{state}`', f'- Reason: {reason or "none"}']
          if expected:
              summary.append(f'- Expected graph: {expected.get("nodes")} nodes / {expected.get("edges")} edges')
          if checks:
              summary.append(f'- Checks: {checks.get("total")} total; OK {checks.get("ok")}, WARN {checks.get("warn")}, NG {checks.get("ng")}')
          if status.get('failed_checks'):
              summary.append(f'- Failed checks: {", ".join(status["failed_checks"])}')
          if status.get('unverified_scope'):
              summary += ['', 'Unverified scope:'] + [f'- {item}' for item in status['unverified_scope']]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write('\n'.join(summary) + '\n')
          print('\n'.join(summary))
          if state not in {'passed', 'unavailable'}:
              sys.exit(1)
          PY

      # 4b) 本文の数値と機械出力の照合
      - name: verify docs
        run: make doc

      # 5) 同一環境で 2 回実行して生成物が一致すること
      - name: determinism
        run: make determ

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outputs
          path: outputs/
          if-no-files-found: warn
