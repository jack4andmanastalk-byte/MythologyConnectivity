name: semtest
on:
  pull_request:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: report-as-failure
        run: |
          {
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "CHECKED_OUT=$(git rev-parse HEAD)"
          echo "PARENTS=$(git rev-list --parents -n1 HEAD | cut -d' ' -f2-)"
          echo "SUBJECT=$(git log -1 --pretty=%s)"
          echo "ORIGIN_MAIN=$(git rev-parse origin/main 2>/dev/null || echo none)"
          } > /tmp/facts.txt
          exit 1
